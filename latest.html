<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最新更新 - Palantir知识联邦</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont/style.css" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F8FAFC;--card:#FFFFFF;--border:rgba(15,23,42,.08);
  --text:#0F172A;--muted:#475569;--accent:#0EA5E9;--accent-soft:rgba(14,165,233,.08);
  --shadow:0 4px 24px rgba(0,0,0,.06);--thumb-placeholder:#E2E8F0;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0F172A;--card:#1E293B;--border:rgba(255,255,255,.08);
    --text:#F8FAFC;--muted:#94A3B8;--accent:#38BDF8;--accent-soft:rgba(56,189,248,.12);
    --shadow:0 4px 24px rgba(0,0,0,.3);--thumb-placeholder:#334155;
  }
}
body{font-family:'Outfit','LXGW WenKai Screen','STKaiti','Kaiti SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--border);padding:18px 24px;position:sticky;top:0;z-index:10}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font-size:1.35em;font-weight:700;color:var(--accent)}
.home-link{color:var(--muted);text-decoration:none;font-size:.86em;white-space:nowrap}
.home-link:hover{color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:28px 24px 48px}
.page-summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-summary p{color:var(--muted);font-size:.92em}
.count{font-size:.82em;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:30px}
.month-group{display:flex;flex-direction:column}
.month-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:14px}
.month-header h2{font-size:1.08em;font-weight:700;color:var(--text)}
.month-count{font-size:.78em;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb{width:100%;aspect-ratio:16/9;background:var(--thumb-placeholder);overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.thumb img[src*="palantir-logo-placeholder"]{width:60%;height:auto;object-fit:contain;padding:20px}
.card:hover .thumb img{transform:scale(1.05)}
.body{padding:14px}
.source-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.68em;font-weight:600;margin-bottom:6px}
.source-badge.blog{background:rgba(14,165,233,.12);color:#0EA5E9}
.source-badge.website{background:rgba(139,92,246,.12);color:#8B5CF6}
.source-badge.docs{background:rgba(16,185,129,.12);color:#10B981}
.title{font-size:.94em;font-weight:600;line-height:1.45;margin-bottom:8px}
.date{font-size:.78em;color:var(--muted)}
.docs-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:30px}
.docs-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.docs-title{font-size:1.08em;font-weight:700;color:var(--text)}
.docs-meta{font-size:.78em;color:var(--muted)}
.docs-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.docs-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:.76em;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.docs-chip.changed{background:rgba(245,158,11,.12);color:#F59E0B}
.docs-chip.announcements{background:rgba(16,185,129,.12);color:#10B981}
.docs-list{display:grid;gap:8px;margin-top:14px}
.docs-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:inherit;transition:border-color .15s}
.docs-item:hover{border-color:var(--accent)}
.docs-item-title{font-size:.88em;font-weight:600;line-height:1.4;min-width:0}
.docs-item-badge{flex:none}
.announcement-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:inherit;transition:border-color .15s}
.announcement-item:hover{border-color:var(--accent)}
.announcement-date{flex:none;font-size:.76em;color:var(--muted)}
.announcement-title{font-size:.88em;font-weight:600;line-height:1.4;min-width:0}
.docs-details{margin-top:14px}
.docs-details summary{cursor:pointer;font-size:.86em;font-weight:600;color:var(--accent)}
.docs-scroll{max-height:420px;overflow:auto;margin-top:10px;padding-right:4px}
.empty,.error{padding:64px 20px;text-align:center;color:var(--muted)}
.error{color:#ef4444}
footer{text-align:center;padding:20px;color:var(--muted);border-top:1px solid var(--border);font-size:.8em}
@media(max-width:700px){
  header{padding:14px 16px}
  main{padding:20px 16px 36px}
  h1{font-size:1.15em}
  .page-summary{align-items:flex-start;flex-direction:column;gap:6px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>最新更新</h1>
    <a class="home-link" href="index.html">返回首页</a>
  </div>
</header>
<main>
  <div class="page-summary">
    <p>2026年7月1日起，按网页发布时间倒序显示；技术文档按最近扫描结果单独显示。</p>
    <span class="count" id="count">正在加载...</span>
  </div>
  <section class="docs-panel" id="docsPanel" aria-live="polite"></section>
  <div class="timeline" id="timeline" aria-live="polite"></div>
</main>
<footer>blog.palantir.com</footer>
<script>
(function(){
  var START_DATE = "2026-07-01";
  var timeline = document.getElementById("timeline");
  var count = document.getElementById("count");
  var docsPanel = document.getElementById("docsPanel");

  function effectiveDate(article) {
    var source = article.source || "blog";
    var value = source === "website" ? article.pd : article.d;
    return (value || "").slice(0, 10);
  }

  function formatDate(value) {
    if (!value) return "";
    var year = value.slice(0, 4);
    var month = Number(value.slice(5, 7));
    var day = Number(value.slice(8, 10));
    return year + "年" + month + "月" + day + "日";
  }

  function formatMonth(value) {
    return value.slice(0, 4) + "年" + Number(value.slice(5, 7)) + "月";
  }

  function localPath(article) {
    var source = article.source || "blog";
    if (source === "website") return "content/website/" + article.s + "/page_zh.html";
    return "articles/" + article.s + "/reader_zh.html";
  }

  function createCard(article) {
    var card = document.createElement("a");
    card.className = "card";
    card.href = localPath(article);
    card.dataset.date = effectiveDate(article);

    var thumb = document.createElement("div");
    thumb.className = "thumb";
    var image = document.createElement("img");
    image.src = article.th || "content/website/images/palantir-logo-placeholder.png";
    image.alt = "";
    image.loading = "lazy";
    thumb.appendChild(image);

    var body = document.createElement("div");
    body.className = "body";
    var badge = document.createElement("span");
    badge.className = "source-badge " + (article.source || "blog");
    badge.textContent = article.source === "website" ? "Website" : "Blog";
    var title = document.createElement("div");
    title.className = "title";
    title.textContent = article.tt || article.t || "";
    var date = document.createElement("time");
    date.className = "date";
    date.dateTime = effectiveDate(article);
    date.textContent = formatDate(effectiveDate(article));
    body.appendChild(badge);
    body.appendChild(title);
    body.appendChild(date);
    card.appendChild(thumb);
    card.appendChild(body);
    return card;
  }

  function createMonthGroup(monthKey, articleCount) {
    var group = document.createElement("section");
    group.className = "month-group";
    var header = document.createElement("div");
    header.className = "month-header";
    var title = document.createElement("h2");
    title.textContent = formatMonth(monthKey);
    var count = document.createElement("span");
    count.className = "month-count";
    count.textContent = articleCount + " 条";
    header.appendChild(title);
    header.appendChild(count);
    var grid = document.createElement("div");
    grid.className = "grid";
    group.appendChild(header);
    group.appendChild(grid);
    return { group: group, grid: grid };
  }

  function createDocsItem(article, type) {
    var item = document.createElement("a");
    item.className = "docs-item";
    item.href = article.hz || article.hp || "#";
    var title = document.createElement("span");
    title.className = "docs-item-title";
    title.textContent = article.tt || article.t || article.s || "";
    var badge = document.createElement("span");
    badge.className = "source-badge docs docs-item-badge";
    badge.textContent = type;
    item.appendChild(title);
    item.appendChild(badge);
    return item;
  }

  function createAnnouncementItem(entry) {
    var item = document.createElement("a");
    item.className = "announcement-item";
    item.href = entry.url || "#";
    item.target = "_blank";
    item.rel = "noopener noreferrer";
    var date = document.createElement("time");
    date.className = "announcement-date";
    date.dateTime = entry.date || "";
    date.textContent = formatDate(entry.date || "");
    var title = document.createElement("span");
    title.className = "announcement-title";
    title.textContent = entry.title_zh || entry.title || "";
    item.appendChild(date);
    item.appendChild(title);
    return item;
  }

  function createDocsPanel(summary, docsMap) {
    docsPanel.textContent = "";
    var header = document.createElement("div");
    header.className = "docs-header";
    var title = document.createElement("h2");
    title.className = "docs-title";
    title.textContent = "技术文档更新";
    var meta = document.createElement("div");
    meta.className = "docs-meta";
    meta.textContent = "扫描时间：" + formatDate((summary.updated_at || "").slice(0, 10));
    header.appendChild(title);
    header.appendChild(meta);

    var summaryRow = document.createElement("div");
    summaryRow.className = "docs-summary";
    var newChip = document.createElement("span");
    newChip.className = "docs-chip";
    newChip.textContent = "新增 " + (summary.new || 0) + " 篇";
    var changedChip = document.createElement("span");
    changedChip.className = "docs-chip changed";
    changedChip.textContent = "变更 " + (summary.changed || 0) + " 篇";
    var announcements = summary.announcement_updates || [];
    var announcementChip = document.createElement("span");
    announcementChip.className = "docs-chip announcements";
    announcementChip.textContent = "公告 " + announcements.length + " 条";
    summaryRow.appendChild(newChip);
    summaryRow.appendChild(changedChip);
    summaryRow.appendChild(announcementChip);

    if (announcements.length) {
      var announcementTitle = document.createElement("h3");
      announcementTitle.textContent = "文档公告";
      announcementTitle.style.fontSize = ".92em";
      announcementTitle.style.marginTop = "16px";
      var announcementList = document.createElement("div");
      announcementList.className = "docs-list";
      announcements.forEach(function(entry) {
        announcementList.appendChild(createAnnouncementItem(entry));
      });
      docsPanel.appendChild(announcementTitle);
      docsPanel.appendChild(announcementList);
    }

    var newTitle = document.createElement("h3");
    newTitle.textContent = "新增文档";
    newTitle.style.fontSize = ".92em";
    newTitle.style.marginTop = "16px";
    var newList = document.createElement("div");
    newList.className = "docs-list";
    (summary.new_slugs || []).forEach(function(slug) {
      newList.appendChild(createDocsItem(docsMap[slug] || { s: slug }, "新增"));
    });

    var details = document.createElement("details");
    details.className = "docs-details";
    var detailsSummary = document.createElement("summary");
    detailsSummary.textContent = "查看 " + (summary.changed || 0) + " 篇变更文档";
    var scroll = document.createElement("div");
    scroll.className = "docs-scroll";
    var changedList = document.createElement("div");
    changedList.className = "docs-list";
    (summary.changed_slugs || []).forEach(function(slug) {
      changedList.appendChild(createDocsItem(docsMap[slug] || { s: slug }, "变更"));
    });
    scroll.appendChild(changedList);
    details.appendChild(detailsSummary);
    details.appendChild(scroll);

    docsPanel.appendChild(header);
    docsPanel.appendChild(summaryRow);
    if ((summary.new_slugs || []).length) {
      docsPanel.appendChild(newTitle);
      docsPanel.appendChild(newList);
    }
    if ((summary.changed_slugs || []).length) docsPanel.appendChild(details);
  }

  Promise.all([
    fetch("data/index.json?_=" + Date.now()).then(function(response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    }),
    fetch("data/docs_update_summary.json?_=" + Date.now()).then(function(response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
  ])
    .then(function(values) {
      var index = values[0];
      var docsSummary = values[1];
      var articles = (index.articles || [])
        .filter(function(article) { return effectiveDate(article) >= START_DATE; })
        .sort(function(a, b) {
          return effectiveDate(b).localeCompare(effectiveDate(a));
        });
      var docsMap = {};
      (index.articles || []).forEach(function(article) {
        if (article.source === "docs") docsMap[article.s] = article;
      });
      createDocsPanel(docsSummary || {}, docsMap);
      var docsTotal = (docsSummary.new || 0) + (docsSummary.changed || 0);
      var announcementTotal = (docsSummary.announcement_updates || []).length;
      count.textContent = "共 " + articles.length + " 篇文章，" + docsTotal + " 页文档更新，" + announcementTotal + " 条文档公告";
      if (!articles.length) {
        timeline.className = "empty";
        timeline.textContent = "暂无更新";
        return;
      }
      var monthCounts = {};
      articles.forEach(function(article) {
        var monthKey = effectiveDate(article).slice(0, 7);
        monthCounts[monthKey] = (monthCounts[monthKey] || 0) + 1;
      });
      var currentMonth = "";
      var currentGrid = null;
      articles.forEach(function(article) {
        var monthKey = effectiveDate(article).slice(0, 7);
        if (monthKey !== currentMonth) {
          currentMonth = monthKey;
          var group = createMonthGroup(monthKey, monthCounts[monthKey]);
          currentGrid = group.grid;
          timeline.appendChild(group.group);
        }
        currentGrid.appendChild(createCard(article));
      });
    })
    .catch(function(error) {
      console.error(error);
      count.textContent = "";
      timeline.className = "error";
      timeline.textContent = "数据加载失败";
    });
})();
</script>
</body>
</html>
