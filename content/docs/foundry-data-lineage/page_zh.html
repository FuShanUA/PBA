<p><strong>数据血缘</strong> 是一款交互式工具，可帮助您全面了解数据在 Foundry 平台中的流动情况。</p>
<p><img alt="Data Lineage flow animation" height="600" node="[object Object]" src="/docs/resources/foundry/data-lineage/data-lineage-flow.gif" style="aspect-ratio:1242 / 646" width="1153.5603715170278"/></p>
<p>使用数据血缘，您可以：</p>
<ul>
<li>轻松查找和发现数据集
<ul>
<li>使用项目、表和列名称搜索数据集</li>
<li>点击进入 Foundry 项目以浏览数据</li>
</ul>
</li>
<li>探索 <a href="/docs/foundry/data-integration/data-pipeline/">管道</a> 通过功能强大的界面
<ul>
<li>展开或隐藏数据集的上游和下游</li>
<li>一次性查看一组表的属性</li>
<li>通过颜色直观展示您的管道（例如，为过期的表着色）</li>
<li>深入了解数据的详细信息，例如其架构、上次构建时间以及生成该数据的代码</li>
</ul>
</li>
<li>与团队成员协作
<ul>
<li>创建管道快照以与其他用户共享</li>
</ul>
</li>
</ul></div>
