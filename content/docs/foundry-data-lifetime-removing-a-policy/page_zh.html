<div class="ptcom-design__markdownDoc__1uarhel" data-pagefind-body="true"><h1 data-pagefind-weight="1" id="user-content-remove-a-deletion-policy" level="1" node="[object Object]"><a aria-hidden="true" aria-label="Copy link to section" class="autolink-header" href="#remove-a-deletion-policy" tabindex="-1"><svg class="autolink-img" fill="currentColor" height="25" viewbox="0 0 25 25" width="25" xmlns="http://www.w3.org/2000/svg"><path d="M20.368,10.29l-1.839,1.84a.75.75,0,1,1-1.061-1.06l1.84-1.841a3.214,3.214,0,0,0,0-4.539,3.286,3.286,0,0,0-4.538,0L11.411,8.05a2.3,2.3,0,0,0-.3.357,3.188,3.188,0,0,0,.3,4.183.75.75,0,1,1-1.061,1.06,4.664,4.664,0,0,1-.474-6.094,3.625,3.625,0,0,1,.474-.566l3.359-3.36a4.709,4.709,0,1,1,6.659,6.66Zm-7.779.06a.749.749,0,0,0,0,1.06,3.172,3.172,0,0,1,.749,3.353,3.068,3.068,0,0,1-.749,1.187L9.23,19.31a3.286,3.286,0,0,1-4.538,0,3.214,3.214,0,0,1,0-4.539l1.84-1.841a.75.75,0,1,0-1.061-1.06L3.632,13.71a4.709,4.709,0,1,0,6.659,6.66l3.359-3.36a4.546,4.546,0,0,0,1.105-1.756,4.712,4.712,0,0,0-1.105-4.9A.75.75,0,0,0,12.589,10.35Z"></path></svg></a>移除删除策略</h1>
<ol>
<li>
<p>导航到 Data Lifetime 应用中的 <strong>策略</strong> 标签页，然后选择您想要移除的策略。</p>
</li>
<li>
<p>从左侧面板中选择 <strong>根数据集</strong> 标签页，找到您想要从该策略中移除的数据集，然后选择三个小点。</p>
</li>
</ol>
<p>要查看某个策略的操作历史，您可以导航到 <strong>历史记录</strong> 标签页。</p>
<ol start="3">
<li>选择 <strong>从数据集中移除策略</strong>。</li>
</ol>
<p><img alt="The option to remove a policy from a dataset." height="136" node="[object Object]" src="/docs/resources/foundry/data-lifetime/removepolicy.png" style="aspect-ratio:300 / 136" width="300"/></p>
<ol start="4">
<li>将显示一个弹出窗口，提示您确认是否移除该策略。选择 <strong>移除策略</strong>。随后，屏幕顶部应显示一条绿色成功消息，表明该策略已成功从所选数据集中移除。</li>
</ol>
<p><img alt="Confirm that you want to remove a policy from a dataset" height="196" node="[object Object]" src="/docs/resources/foundry/data-lifetime/confirmpolicyremoval.png" style="aspect-ratio:742 / 196" width="742"/></p></div>
