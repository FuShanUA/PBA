<p><strong>数据保留</strong> 是整体存储管理系统的一部分，描述了规定数据在 Palantir 平台中存储多长时间以及数据如何从平台中删除的流程。根据 FIPPs 原则，尤其是 PII 等敏感数据，通常必须在处理目的达成后立即删除，以符合适用的数据保护法规。根据您的合同约定或合规需求，某些数据可能也需要保留。因此，您应注意，从 Palantir 平台删除数据在某个时间点后将变得不可逆转，并应在整个流程中实施相关控制措施（例如资格审核）。</p>
<p>我们强烈建议您尽早确定保留要求，最好在摄取任何数据之前就完成。</p>
<p>如需了解更多信息，请参阅关于 <a href="/docs/foundry/retention/overview/">保留机制的工作原理</a>的文档，或联系 Palantir 支持团队。</p></div>
