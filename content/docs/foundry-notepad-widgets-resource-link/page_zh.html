<p>当将指向另一个 Foundry 资源（例如 Contour 分析或代码仓库）的链接粘贴到 Notepad 文档中时，会创建 Foundry 资源关联。该关联会自动显示资源的名称，但保留原始路径。</p>
<p>您也可以通过点击 + Add Widget 或在段落字段中键入 / 来插入 Foundry 资源关联，以打开 <a href="/docs/foundry/notepad/embed-widgets/#from-a-document">组件插入菜单</a>.</p>
<p>如果您不希望 Notepad 将您的关联转换为资源关联，请使用键盘快捷键 Ctrl+Shift+V (Windows) 或 Cmd+Shift+V (macOS) 粘贴，以将关联作为纯文本插入。</p>
