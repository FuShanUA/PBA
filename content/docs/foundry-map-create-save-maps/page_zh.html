<h2 data-pagefind-weight="0.9" id="user-content-create-a-new-map" level="2" node="[object Object]"><a aria-hidden="true" aria-label="Copy link to section" class="autolink-header" href="#create-a-new-map" tabindex="-1"><svg class="autolink-img" fill="currentColor" height="25" viewbox="0 0 25 25" width="25" xmlns="http://www.w3.org/2000/svg"><path d="M20.368,10.29l-1.839,1.84a.75.75,0,1,1-1.061-1.06l1.84-1.841a3.214,3.214,0,0,0,0-4.539,3.286,3.286,0,0,0-4.538,0L11.411,8.05a2.3,2.3,0,0,0-.3.357,3.188,3.188,0,0,0,.3,4.183.75.75,0,1,1-1.061,1.06,4.664,4.664,0,0,1-.474-6.094,3.625,3.625,0,0,1,.474-.566l3.359-3.36a4.709,4.709,0,1,1,6.659,6.66Zm-7.779.06a.749.749,0,0,0,0,1.06,3.172,3.172,0,0,1,.749,3.353,3.068,3.068,0,0,1-.749,1.187L9.23,19.31a3.286,3.286,0,0,1-4.538,0,3.214,3.214,0,0,1,0-4.539l1.84-1.841a.75.75,0,1,0-1.061-1.06L3.632,13.71a4.709,4.709,0,1,0,6.659,6.66l3.359-3.36a4.546,4.546,0,0,0,1.105-1.756,4.712,4.712,0,0,0-1.105-4.9A.75.75,0,0,0,12.589,10.35Z"></path></svg></a>创建新地图</h2>
<p>要创建地图，请展开左侧的 Foundry 导航栏，然后点击“应用”部分中的 <strong>“查看全部”</strong> 。您将找到 <strong>Map</strong> 应用程序，它位于 <strong>“运营应用程序”</strong> 部分下。</p>
<img alt="Map application in the Foundry navigation bar" node="[object Object]" src="/docs/resources/foundry/map/navigation-bar-map.png?width=430" style="aspect-ratio:860 / 616" width="430"/>
<h2 data-pagefind-weight="0.9" id="user-content-save-a-map" level="2" node="[object Object]"><a aria-hidden="true" aria-label="Copy link to section" class="autolink-header" href="#save-a-map" tabindex="-1"><svg class="autolink-img" fill="currentColor" height="25" viewbox="0 0 25 25" width="25" xmlns="http://www.w3.org/2000/svg"><path d="M20.368,10.29l-1.839,1.84a.75.75,0,1,1-1.061-1.06l1.84-1.841a3.214,3.214,0,0,0,0-4.539,3.286,3.286,0,0,0-4.538,0L11.411,8.05a2.3,2.3,0,0,0-.3.357,3.188,3.188,0,0,0,.3,4.183.75.75,0,1,1-1.061,1.06,4.664,4.664,0,0,1-.474-6.094,3.625,3.625,0,0,1,.474-.566l3.359-3.36a4.709,4.709,0,1,1,6.659,6.66Zm-7.779.06a.749.749,0,0,0,0,1.06,3.172,3.172,0,0,1,.749,3.353,3.068,3.068,0,0,1-.749,1.187L9.23,19.31a3.286,3.286,0,0,1-4.538,0,3.214,3.214,0,0,1,0-4.539l1.84-1.841a.75.75,0,1,0-1.061-1.06L3.632,13.71a4.709,4.709,0,1,0,6.659,6.66l3.359-3.36a4.546,4.546,0,0,0,1.105-1.756,4.712,4.712,0,0,0-1.105-4.9A.75.75,0,0,0,12.589,10.35Z"></path></svg></a>保存地图</h2>
<p>首次保存地图时，请点击屏幕左上角的 <strong>“另存为...”</strong> ，然后选择保存地图的位置。</p>
<p><img alt="Map Save As button" height="50" node="[object Object]" src="/docs/resources/foundry/map/map-overview-save-as-button.png" style="aspect-ratio:268 / 50" width="268"/></p>
<p>再次保存地图时，请点击屏幕左上角的 <strong>“保存”</strong> 。地图不会自动保存。</p>
<p><img alt="Map Save button" height="50" node="[object Object]" src="/docs/resources/foundry/map/map-overview-save-button.png" style="aspect-ratio:332 / 50" width="332"/></p></div>
