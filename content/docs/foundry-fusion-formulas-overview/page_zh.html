<p>Fusion 支持标准电子表格公式（单元格引用、加法等）以及函数。Fusion 的函数库是 Contour 表达式语言 DSL 和 Fusion 专用电子表格函数的组合。有关函数列表，请访问 <a href="/docs/foundry/fusion/function-library/">你可以展示数值或迷你图，执行计算，或对时间序列运行基础函数。详情请查阅</a>.</p>
<p>类型 <code>=</code> 到任意单元格中以使用公式。输入 <code>=a</code> 到公式栏中，将为您提供一些建议列表。</p>
