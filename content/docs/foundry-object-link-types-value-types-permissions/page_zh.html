<p>值类型的权限由平台 <a href="/docs/foundry/platform-security-management/manage-orgs-and-spaces/#spaces">空间</a>进行管理。空间中的任何值类型都会自动导入，并可供关联的本体论使用。其他使用者可以将值类型导入到其项目范围中，这与用户导入转换配置文件或管道输入的方式类似。</p>
<p>对空间拥有查看（读取）权限的用户可以在该空间及关联的本体论中将值类型分配给属性类型或共享属性类型。空间的编辑者或所有者可以在该空间中创建、编辑或删除值类型。</p></div>
