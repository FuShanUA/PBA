<p>Apollo 团队是使用 Apollo 平台操作软件的人员的主要组织单位。我们认为，团队对于软件产品的长期稳定开发至关重要。Apollo 团队的概念是权限、警报路由、变更请求审批以及 Apollo 中许多其他工作流的基础。团队是在 Apollo 生态系统中配置人员相关设置的方式；<em>必须</em>定义一个团队，一组人员才能管理其软件环境、产品或发布推广设置。</p>
<p>Apollo 中的团队由两个或更多组定义：至少必须有一个有权更改团队成员资格的管理员组，以及一个将获得未来授予该团队的所有操作权限的成员组。</p>
<p><a href="/docs/apollo/managing-teams/overview/">了解更多关于管理团队的信息。</a></p></div>
