<div class="ptcom-design__markdownDoc__1uarhel" data-pagefind-body="true"><h1 data-pagefind-weight="1" id="user-content-view-policy-activity-history" level="1" node="[object Object]"><a aria-hidden="true" aria-label="Copy link to section" class="autolink-header" href="#view-policy-activity-history" tabindex="-1"><svg class="autolink-img" fill="currentColor" height="25" viewbox="0 0 25 25" width="25" xmlns="http://www.w3.org/2000/svg"><path d="M20.368,10.29l-1.839,1.84a.75.75,0,1,1-1.061-1.06l1.84-1.841a3.214,3.214,0,0,0,0-4.539,3.286,3.286,0,0,0-4.538,0L11.411,8.05a2.3,2.3,0,0,0-.3.357,3.188,3.188,0,0,0,.3,4.183.75.75,0,1,1-1.061,1.06,4.664,4.664,0,0,1-.474-6.094,3.625,3.625,0,0,1,.474-.566l3.359-3.36a4.709,4.709,0,1,1,6.659,6.66Zm-7.779.06a.749.749,0,0,0,0,1.06,3.172,3.172,0,0,1,.749,3.353,3.068,3.068,0,0,1-.749,1.187L9.23,19.31a3.286,3.286,0,0,1-4.538,0,3.214,3.214,0,0,1,0-4.539l1.84-1.841a.75.75,0,1,0-1.061-1.06L3.632,13.71a4.709,4.709,0,1,0,6.659,6.66l3.359-3.36a4.546,4.546,0,0,0,1.105-1.756,4.712,4.712,0,0,0-1.105-4.9A.75.75,0,0,0,12.589,10.35Z"></path></svg></a>查看策略活动历史</h1>
<p>有时，您可能需要检查对特定策略执行的所有操作。Data Lifetime 应用程序允许您查看应用于某个策略的所有操作，包括添加新数据集（<strong>应用程序</strong>）或从策略中移除数据集（<strong>移除</strong>）。要查看这些操作，请参阅 <strong>历史记录</strong> 选项卡。</p>
<ol>
<li>在 Data Lifetime 应用程序中，导航至 <strong>策略</strong> 选项卡。</li>
<li>选择要调查的策略。</li>
<li>选择 <strong>历史记录</strong> 以查看对该策略执行的所有操作，从最新到最旧。</li>
</ol>
<p><img alt="View policy changes from the History tab." height="463" node="[object Object]" src="/docs/resources/foundry/data-lifetime/policyoperation-hl-logo.png" style="aspect-ratio:1126 / 463" width="1126"/></p>
<ol start="4">
<li>要查看已删除或标记为删除的事务，请导航至 <strong>删除</strong> 选项卡。您可以按 <a href="/docs/foundry/data-lifetime/FAQ/#how-do-I-find-the-transaction-id-of-a-dataset-to-use-the-transaction-filter-in-the-data-lifetime-application"><strong>事务 ID</strong></a> 或 <strong>时间范围</strong>。</li>
</ol>
<p><img alt="View datasets that are deleted or scheduled to be deleted." height="600" node="[object Object]" src="/docs/resources/foundry/data-lifetime/deletion-hl-logo.png" style="aspect-ratio:2148 / 754" width="1709.283819628647"/></p></div>
